<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FormFixture</title>
</head>
<body>
<form id="f">
  <input id="name" name="name" type="text">
  <input id="email" name="email" type="email" required>
  <textarea id="bio" name="bio"></textarea>
  <select id="color" name="color">
    <option value="r">Red</option>
    <option value="g">Green</option>
    <option value="b">Blue</option>
  </select>
  <select id="tags" name="tags" multiple>
    <option value="a">Alpha</option>
    <option value="b">Beta</option>
    <option value="c">Gamma</option>
  </select>
  <input id="agree" name="agree" type="checkbox">
  <input id="size-s" name="size" type="radio" value="s" checked>
  <input id="size-m" name="size" type="radio" value="m">
  <input id="file" name="file" type="file">
  <input id="ro" name="ro" type="text" readonly value="fixed">
  <div id="editor" contenteditable="true"></div>
  <button type="submit">Send</button>
</form>
<script>
  window.events = [];
  window.submits = [];
  // 模拟 React 一类框架：在实例上拦截 value setter，只认 input 事件里的值变化
  const tracked = document.getElementById('name');
  const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  let lastSeen = '';
  Object.defineProperty(tracked, 'value', {
    get() { return proto.get.call(this); },
    set(v) { lastSeen = String(v); proto.set.call(this, v); },
  });
  window.frameworkChanges = [];
  tracked.addEventListener('input', () => {
    const now = proto.get.call(tracked);
    if (now !== lastSeen) { window.frameworkChanges.push(now); lastSeen = now; }
  });
  for (const el of document.querySelectorAll('input, textarea, select, [contenteditable]')) {
    el.addEventListener('input', (e) => window.events.push({ id: el.id, type: 'input', trusted: e.isTrusted }));
    el.addEventListener('change', (e) => window.events.push({ id: el.id, type: 'change' }));
  }
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    window.submits.push(Object.fromEntries(new FormData(e.target)));
  });
</script>
</body>
</html>
